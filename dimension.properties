# 1.8.0 And Above Mapping:

# For 1.16+ the Euphoria Patcher Mod injects into Iris/Oculus to allow wildcards within the dimension names.
# Example: dimension.world-1=modname:dark* will match all dimensions that start with "dark" from the mod "modname".
# This is useful for dimensions which have a randomized name attached.

#if MC_VERSION > 10710

# Overworld - All unknown dimensions are considered as Overworld because of the * wildcard
dimension.world0=*

# Nether
dimension.world-1 = the_nether *nether* *Nether* \
\
ad_astra:venus \
\
infernalcross:infernalcrossing \
\
prominent:cinderstone_depths prominent:vaaz_assault* prominent:vaaz_past prominent:vaaz_present \
\
the_bumblezone:the_bumblezone

# End
dimension.world1 = the_end *end* *End* \
\
bestest:hyperspace_lumiose bestest:hyperspace_sewers \
\
minecraft:thermalpoint \
\
prominent:end_of_time prominent:unholy_prison

# Cave / Void - Dimensions that are a giant cave or a void. Overworld, but no sun, moon, stars, clouds or light shafts, only the sky and fog color
dimension.world_cave_void = deeperdarker:otherside \
\
the_afterdark:afterdark \
\
the_deep_void:deep_void \
\
the_deeper_void:void_dimension \
\
undergarden:undergarden

# No Clouds - Same as Cave / Void (no sun, moon, stars or clouds, flat sky and fog color), but keeps light shafts and atmospheric fog
dimension.world_no_clouds = twilightforest:twilight_forest

# Space - Airless dimensions. Overworld but with no atmosphere, no clouds, and no light shafts and some more tweaks
dimension.world_space = ad_astra:earth_orbit ad_astra:glacio_orbit ad_astra:mars_orbit ad_astra:mercury_orbit ad_astra:moon ad_astra:moon_orbit ad_astra:venus_orbit \
\
stellaris:earth_orbit stellaris:moon \
\
untagged_mobs:moon

# Planet - Thin atmosphere. Same as Space, but the sky, light and fog keep the planet's own colors
dimension.world_planet = ad_astra:mars ad_astra:mercury \
\
stellaris:mars




